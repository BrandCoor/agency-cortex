[project]
name = "agency-cortex"
version = "0.16.1"
description = "Cok musterili sosyal medya asistani"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.118.0",
    "uvicorn[standard]==0.37.0",
    "sqlalchemy==2.0.43",
    "alembic==1.16.5",
    "psycopg[binary]==3.2.10",
    "redis==6.4.0",
    "celery==5.5.3",
    "pydantic==2.11.9",
    "pydantic-settings==2.10.1",
    "structlog==25.4.0",
    "cryptography==46.0.1",
    "httpx==0.28.1",
    "argon2-cffi==25.1.0",
    "pyjwt==2.10.1",
    "email-validator==2.3.0",
    "anthropic==1.4.0",
    "jinja2==3.1.6",
    "python-multipart==0.0.20",
]

[project.optional-dependencies]
dev = [
    "pytest==8.4.2",
    "pytest-asyncio==1.2.0",
    "ruff==0.13.1",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

# Paket kesfi acikca sinirlanir; aksi halde setuptools tests/ ve alembic/
# klasorlerini de paket sanip hata verir.
# "app*" kalibi alt paketleri de (app.api, app.panel, app.cli ...) kapsar;
# yalnizca "app" yazilsaydi alt paketler kurulan pakete girmezdi.
[tool.setuptools.packages.find]
include = ["app*"]

# Jinja sablonlari Python dosyasi degildir; acikca eklenmezse pakete girmez.
[tool.setuptools.package-data]
"app.panel" = ["templates/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "BLE"]
ignore = [
    "E501",  # satir uzunlugu formatter tarafindan yonetilir
    "N818",  # istisna adlarinda "Error" son eki zorunlu degil;
             # adlandirma PlatformError atasi altinda zaten tutarli
]
