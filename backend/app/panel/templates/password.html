{% extends "base.html" %}
{% block title %}Şifre değiştir — Agency Cortex{% endblock %}
{% block content %}
<div style="max-width: 420px; margin: 40px auto;">
  <h1>Şifre değiştir</h1>
  <p class="sub">Yeni şifre en az {{ min_uzunluk }} karakter olmalıdır.</p>
  {% if error %}<div class="err">{{ error }}</div>{% endif %}
  {% if ok %}<div class="ok">{{ ok }}</div>{% endif %}
  <form method="post" action="/panel/sifre" class="card">
    <label for="mevcut">Mevcut şifre</label>
    <input id="mevcut" name="mevcut" type="password" required autofocus autocomplete="current-password">
    <label for="yeni">Yeni şifre</label>
    <input id="yeni" name="yeni" type="password" required autocomplete="new-password">
    <label for="yeni_tekrar">Yeni şifre (tekrar)</label>
    <input id="yeni_tekrar" name="yeni_tekrar" type="password" required autocomplete="new-password">
    <div style="margin-top:16px"><button type="submit">Şifreyi değiştir</button></div>
  </form>
</div>
{% endblock %}
