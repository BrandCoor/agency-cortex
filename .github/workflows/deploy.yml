name: Sunucuya Kur

# Bu is akisi VPS'e SSH ile baglanip sistemi kurar/gunceller.
#
# GIZLI BILGILER NEREDE?
# SECRET_KEY, ENCRYPTION_KEY ve veritabani sifresi SUNUCUDA URETILIR.
# Hicbiri GitHub'a, sohbete veya baska bir yere kopyalanmaz.
# Bir kez uretildikten sonra korunur; sonraki kurulumlarda degismez.

on:
  workflow_dispatch:
    inputs:
      onay:
        description: 'Uretim sunucusuna kurulum yapilacak. Onaylamak icin KUR yazin.'
        required: true
        default: ''
      tanilama:
        description: 'Giris calismiyorsa hesap tanilamasi calistirilsin mi? EVET yazin.'
        required: false
        default: ''
      kurtarma:
        description: 'Panele giremiyorsaniz sifre belirleme bagi uretilsin mi? EVET yazin.'
        required: false
        default: ''

env:
  VPS_HOST: 187.124.22.8
  VPS_USER: root
  PROJE_DIZINI: /opt/agency-cortex
  PUBLIC_DOMAIN: agencycortex.tech

jobs:
  deploy:
    name: Kurulum
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read

    steps:
      - name: Onay kontrolu
        run: |
          if [ "${{ github.event.inputs.onay }}" != "KUR" ]; then
            echo "Onay verilmedi. Kurulum durduruldu."
            exit 1
          fi

      - uses: actions/checkout@v4

      - name: Imaj adini hazirla
        id: img
        run: |
          ad="$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')-api"
          echo "ref=ghcr.io/${ad}" >> "$GITHUB_OUTPUT"

      - name: SSH anahtarini kur ve dogrula
        run: |
          set -eu
          mkdir -p ~/.ssh

          if [ -z "${{ secrets.VPS_SSH_KEY }}" ]; then
            echo "HATA: VPS_SSH_KEY tanimli degil veya bos."
            exit 1
          fi

          # Windows'tan kopyalanan metinlerde satir sonlarinda gorunmez \r
          # karakteri bulunur; bu, anahtari gecersiz kilar. Temizleniyor.
          ham=$(printf '%s' "${{ secrets.VPS_SSH_KEY }}" | tr -d '\r')

          # Anahtar iki bicimde kabul edilir:
          #  1) Tek satir base64 (onerilen - kopyalama hatasi olmaz)
          #  2) Klasik cok satirli PEM metni
          #
          # Cok satirli metinlerde satirlarin eksik kopyalanmasi cok sik
          # yasandigi icin tek satirli bicim tercih edilir.
          # DIKKAT: Dosyanin tamami base64'lendiginde cozulmus icerik
          # "-----BEGIN ... PRIVATE KEY-----" ile baslar. "openssh-key-v1"
          # ifadesi ic govdede bulunur, cozulmus metnin basinda DEGIL.
          if printf '%s' "$ham" | tr -d '[:space:]' | base64 -d 2>/dev/null > /tmp/cozulmus \
               && grep -q 'PRIVATE KEY' /tmp/cozulmus 2>/dev/null; then
            echo "Bicim: tek satir base64 (cozuldu)"
            cp /tmp/cozulmus ~/.ssh/id_deploy
            rm -f /tmp/cozulmus
          else
            rm -f /tmp/cozulmus
            echo "Bicim: cok satirli metin"
            printf '%s\n' "$ham" > ~/.ssh/id_deploy

            # Bas/son satirlar eksikse tamamlanir.
            if ! head -1 ~/.ssh/id_deploy | grep -q 'BEGIN.*PRIVATE KEY'; then
              if grep -q 'b3BlbnNzaC1rZXktdjEA' ~/.ssh/id_deploy; then
                echo "Not: BEGIN/END satirlari eksikti, tamamlandi."
                {
                  echo "-----BEGIN OPENSSH PRIVATE KEY-----"
                  grep -v -e 'BEGIN' -e 'END' ~/.ssh/id_deploy | sed '/^[[:space:]]*$/d'
                  echo "-----END OPENSSH PRIVATE KEY-----"
                } > ~/.ssh/id_deploy.yeni
                mv ~/.ssh/id_deploy.yeni ~/.ssh/id_deploy
              fi
            fi
          fi
          chmod 600 ~/.ssh/id_deploy

          # --- Teshis: icerik yazdirilmadan neyin yanlis oldugu bulunur ---
          SATIR=$(wc -l < ~/.ssh/id_deploy | tr -d ' ')
          ILK=$(head -1 ~/.ssh/id_deploy)
          SON=$(tail -1 ~/.ssh/id_deploy)

          echo "Kasadaki degerin bicimi:"
          echo "  satir sayisi : $SATIR"

          if printf '%s' "$ILK" | grep -q '^ssh-'; then
            echo "  sorun        : Bu bir ACIK anahtar (.pub dosyasi)."
            echo ""
            echo "GEREKEN: uzantisiz dosya, yani agency_cortex_deploy"
            exit 1
          fi

          if ! printf '%s' "$ILK" | grep -q 'BEGIN.*PRIVATE KEY'; then
            echo "  ilk satir    : BEKLENEN BASLIK YOK"
            echo ""
            echo "Anahtar eksik kopyalanmis gorunuyor."
            echo "TEK SATIR base64 bicimini kullanin; kopyalama hatasi olmaz:"
            echo "  [Convert]::ToBase64String([IO.File]::ReadAllBytes(\"\$env:USERPROFILE\\.ssh\\agency_cortex_deploy\")) | Set-Clipboard"
            exit 1
          fi
          echo "  ilk satir    : dogru (BEGIN ... PRIVATE KEY)"

          if ! printf '%s' "$SON" | grep -q 'END.*PRIVATE KEY'; then
            echo "  son satir    : BEKLENEN BITIS YOK"
            echo ""
            echo "Son satir '-----END OPENSSH PRIVATE KEY-----' olmali."
            echo "Metnin sonu eksik kopyalanmis olabilir."
            exit 1
          fi
          echo "  son satir    : dogru (END ... PRIVATE KEY)"

          if ! ssh-keygen -y -f ~/.ssh/id_deploy > ~/.ssh/id_deploy.pub 2>/tmp/kerr; then
            echo "  sonuc        : anahtar okunamadi"
            echo ""
            echo "Baslik ve bitis dogru ama icerik bozuk."
            echo "Anahtar bir parola ile korunuyor olabilir."
            echo "ssh-keygen mesaji:"
            sed 's/^/    /' /tmp/kerr
            exit 1
          fi

          echo "  sonuc        : GECERLI"
          echo ""
          echo "Bu gizli anahtarin karsiligi olan acik anahtar:"
          cat ~/.ssh/id_deploy.pub
          echo "Parmak izi:"
          ssh-keygen -lf ~/.ssh/id_deploy.pub
          echo "(Beklenen parmak izi: SHA256:vD6UoVQZjl/w9s0f8585MipiTlY75224C3RqTNVJJWk)"

          ssh-keyscan -H "$VPS_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true

          echo ""
          echo "Once sunucunun 22. kapisi aciliyor mu diye bakiyoruz."
          # NEDEN AYRI KONTROL? Baglanti kurulamamasi ile anahtarin
          # reddedilmesi TAMAMEN FARKLI iki sorundur ve cozumleri de farklidir.
          # Ikisini tek mesajla bildirmek yanlis yone sevk eder.
          if timeout 20 bash -c "cat < /dev/null > /dev/tcp/$VPS_HOST/22" 2>/dev/null; then
            echo "TAMAM: sunucu 22. kapidan yanit veriyor."
            kapi="acik"
          else
            echo "Sunucu 22. kapidan yanit VERMIYOR."
            kapi="kapali"
          fi

          echo ""
          echo "Sunucuya baglanti deneniyor..."
          if ssh -i ~/.ssh/id_deploy -o BatchMode=yes -o ConnectTimeout=15 \
               "$VPS_USER@$VPS_HOST" 'echo "BAGLANTI BASARILI: $(hostname)"'; then
            echo "SSH erisimi calisiyor."
          elif [ "$kapi" = "kapali" ]; then
            echo ""
            echo "HATA: Sunucuya hic ULASILAMIYOR (baglanti zaman asimi)."
            echo "Bu bir anahtar sorunu DEGILDIR; anahtar yukarida gecerli cikti."
            echo ""
            echo "Olasi nedenler:"
            echo "  - Sunucu kapali veya yeniden baslatiliyor"
            echo "  - Hostinger guvenlik duvari 22. kapiyi engelliyor"
            echo "  - Gecici ag kesintisi"
            echo ""
            echo "COZUM: Hostinger panelinden sunucunun calistigini ve"
            echo "guvenlik duvarinda 22. kapinin acik oldugunu dogrulayin,"
            echo "sonra bu is akisini tekrar calistirin."
            exit 1
          else
            echo ""
            echo "HATA: Sunucuya ulasiliyor ama anahtar KABUL EDILMEDI."
            echo ""
            echo "Acik anahtar sunucudaki /root/.ssh/authorized_keys dosyasina"
            echo "islenmemis. Hostinger API anahtari hesaba kaydediyor ancak"
            echo "calisan sunucuya otomatik yazmiyor."
            echo ""
            echo "COZUM: Hostinger panelindeki tarayici terminalinde"
            echo "acik anahtari authorized_keys dosyasina ekleyin."
            exit 1
          fi

      - name: Sunucuyu hazirla
        run: |
          ssh -i ~/.ssh/id_deploy -o BatchMode=yes "$VPS_USER@$VPS_HOST" bash -s <<'UZAK'
          set -eu
          DIZIN=/opt/agency-cortex
          mkdir -p "$DIZIN"

          # Docker kurulu degilse kur
          if ! command -v docker >/dev/null 2>&1; then
            echo "Docker kuruluyor..."
            curl -fsSL https://get.docker.com | sh
          fi
          docker --version
          docker compose version
          UZAK

      - name: Dosyalari gonder
        run: |
          scp -i ~/.ssh/id_deploy -o BatchMode=yes \
            ops/docker-compose.prod.yml \
            "$VPS_USER@$VPS_HOST:$PROJE_DIZINI/docker-compose.yml"
          scp -i ~/.ssh/id_deploy -o BatchMode=yes \
            ops/Caddyfile \
            "$VPS_USER@$VPS_HOST:$PROJE_DIZINI/Caddyfile"
          # Yedekleme betikleri. Sunucuda calisirlar; imajin icinde degiller
          # cunku docker compose komutlarini SUNUCUDAN cagirmalari gerekir.
          ssh -i ~/.ssh/id_deploy -o BatchMode=yes "$VPS_USER@$VPS_HOST" \
            "mkdir -p $PROJE_DIZINI/ops"
          scp -i ~/.ssh/id_deploy -o BatchMode=yes \
            ops/yedek_al.sh ops/yedek_dogrula.sh ops/yedek_geri_yukle.sh \
            "$VPS_USER@$VPS_HOST:$PROJE_DIZINI/ops/"
          ssh -i ~/.ssh/id_deploy -o BatchMode=yes "$VPS_USER@$VPS_HOST" \
            "chmod +x $PROJE_DIZINI/ops/yedek_*.sh"

      - name: Ayar dosyasini hazirla (gizli degerler SUNUCUDA uretilir)
        run: |
          ssh -i ~/.ssh/id_deploy -o BatchMode=yes "$VPS_USER@$VPS_HOST" \
            "DIZIN='$PROJE_DIZINI' IMAJ='${{ steps.img.outputs.ref }}:latest' \
             DOMAIN='$PUBLIC_DOMAIN' bash -s" <<'UZAK'
          set -eu
          cd "$DIZIN"

          if [ ! -f .env ]; then
            echo "Ilk kurulum: gizli degerler sunucuda uretiliyor..."
            cat > .env <<EOF
          APP_ENV=production
          APP_NAME=Agency Cortex
          LOG_LEVEL=INFO
          TZ=Europe/Istanbul

          SECRET_KEY=$(openssl rand -base64 48 | tr -d '\n')
          ENCRYPTION_KEY=$(openssl rand -base64 48 | tr -d '\n')
          ACCESS_TOKEN_TTL_MINUTES=30
          REFRESH_TOKEN_TTL_DAYS=14

          POSTGRES_HOST=postgres
          POSTGRES_PORT=5432
          POSTGRES_DB=agency_cortex
          POSTGRES_USER=agency
          POSTGRES_PASSWORD=$(openssl rand -base64 32 | tr -d '\n=/+' | head -c 40)

          REDIS_HOST=redis
          REDIS_PORT=6379
          REDIS_DB=0

          PUBLIC_DOMAIN=${DOMAIN}
          ACME_EMAIL=kocyap41@gmail.com
          CORS_ORIGINS=https://${DOMAIN}

          AI_PROVIDER_MODE=fake
          PLATFORM_MODE=fake
          AI_MONTHLY_BUDGET_USD=50

          FEATURE_PUBLISHING_ENABLED=false
          FEATURE_COMMENT_REPLY_ENABLED=false
          FEATURE_DM_ENABLED=false

          META_LOGIN_MODE=instagram_login
          META_REDIRECT_URI=https://${DOMAIN}/api/v1/oauth/meta/callback
          META_WEBHOOK_CALLBACK_URL=https://${DOMAIN}/api/v1/webhooks/meta
          META_WEBHOOK_VERIFY_TOKEN=$(openssl rand -hex 24)
          EOF
            chmod 600 .env
            echo "Ayar dosyasi olusturuldu ve korumaya alindi."
          else
            echo "Mevcut ayar dosyasi korunuyor (gizli degerler degistirilmedi)."
          fi

          # Imaj adresi her kurulumda guncellenir.
          grep -v '^APP_IMAGE=' .env > .env.tmp 2>/dev/null || true
          mv .env.tmp .env 2>/dev/null || true
          echo "APP_IMAGE=${IMAJ}" >> .env
          chmod 600 .env
          UZAK

      - name: Imaji indir ve baslat
        run: |
          ssh -i ~/.ssh/id_deploy -o BatchMode=yes "$VPS_USER@$VPS_HOST" \
            "DIZIN='$PROJE_DIZINI' KULLANICI='${{ github.actor }}' \
             JETON='${{ secrets.GITHUB_TOKEN }}' bash -s" <<'UZAK'
          set -eu
          cd "$DIZIN"

          # Ozel kayit defterine giris. Jeton kisa omurludur ve is bitince gecersizlesir.
          echo "$JETON" | docker login ghcr.io -u "$KULLANICI" --password-stdin

          docker compose pull
          docker compose up -d --remove-orphans

          # Giris bilgisi sunucuda birakilmaz.
          docker logout ghcr.io

          echo "--- servis durumu ---"
          docker compose ps
          UZAK

      # NEDEN AYRI BIR ADIM?
      # Caddyfile bir baglama (bind mount) ile konteynere veriliyor. Dosya
      # sunucuda degisse bile "docker compose up -d" caddy servisinin
      # tanimini degismemis gorur ve konteynere hic dokunmaz; Caddy de
      # yapilandirmayi yalnizca acilista okudugu icin ESKI ayarla calismaya
      # devam eder. 21 Eylul'de panelin canliya cikmamasinin sebebi buydu.
      #
      # Once dogrula, sonra yeniden yukle: bozuk bir dosya siteyi dusurmesin.
      - name: Caddy yapilandirmasini yeniden yukle
        run: |
          ssh -i ~/.ssh/id_deploy -o BatchMode=yes "$VPS_USER@$VPS_HOST" bash -s <<'UZAK'
          set -eu
          cd /opt/agency-cortex

          # DIKKAT: Bu betik "bash -s" ile standart girdiden okunuyor.
          # "docker compose exec -T" de standart girdiyi okur ve betigin
          # geri kalanini yutar; bu yuzden her cagriya </dev/null eklendi.
          # (21 Eylul'de reload adimi tam bu yuzden hic calismamisti.)
          echo "--- yapilandirma dogrulaniyor ---"
          docker compose exec -T caddy caddy validate --adapter caddyfile --config /etc/caddy/Caddyfile </dev/null

          echo "--- yeniden yukleniyor (kesintisiz) ---"
          if docker compose exec -T caddy caddy reload --adapter caddyfile --config /etc/caddy/Caddyfile </dev/null; then
            echo "TAMAM: Caddy yeni yapilandirmayi yukledi."
          else
            echo "UYARI: reload basarisiz, konteyner yeniden baslatiliyor."
            docker compose restart caddy
          fi
          UZAK

      - name: Saglik kontrolu
        run: |
          ssh -i ~/.ssh/id_deploy -o BatchMode=yes "$VPS_USER@$VPS_HOST" bash -s <<'UZAK'
          set -eu
          cd /opt/agency-cortex
          for i in $(seq 1 40); do
            if docker compose exec -T api curl -fsS http://localhost:8000/readyz >/dev/null 2>&1 </dev/null; then
              echo "BASARILI: sistem hazir"
              docker compose exec -T api curl -sS http://localhost:8000/readyz </dev/null
              echo
              docker compose exec -T api curl -sS http://localhost:8000/version </dev/null
              exit 0
            fi
            sleep 5
          done
          echo "HATA: sistem 200 saniyede hazir olmadi"
          echo "--- son loglar ---"
          docker compose logs --tail=60
          exit 1
          UZAK

      # Sisteme disaridan acik bir "kayit ol" sayfasi YOKTUR. Ilk hesap
      # yalnizca burada, sunucunun icinde acilir.
      #
      # Sifre nereden geliyor? GitHub deposunun Secrets bolumunden.
      # Sifre bu adimda komut satirina yazilmaz (sunucudaki `ps` ciktisinda
      # gorunmez), dosyaya yazilmaz ve ekrana basilmaz. Yalnizca standart
      # girdi (stdin) uzerinden komuta aktarilir.
      #
      # Sistemde zaten kullanici varsa komut hicbir sey yapmaz; bu adim her
      # kurulumda guvenle tekrar calistirilabilir.
      # Yedekleme her kurulumda kurulur ve GERCEKTEN calistigi dogrulanir.
      # "Yedek aliniyor" demek yetmez; geri yuklenemeyen bir yedek, yedek
      # degildir.
      #
      # DIKKAT: uzak betik "bash -s" ile DEGIL, dosyadan calistiriliyor.
      # "bash -s" betigi standart girdiden okur; icerideki "docker compose
      # exec -T" cagrilari da standart girdiyi okuyup betigin kalanini
      # yutar. 21 Eylul'de dogrulama adimi tam bu yuzden sessizce
      # atlanmisti ve kurulum yine de yesil gorunmustu.
      - name: Yedekleme kur ve dogrula
        run: |
          ssh -i ~/.ssh/id_deploy -o BatchMode=yes "$VPS_USER@$VPS_HOST" \
            "cat > /tmp/yedek_kur.sh" <<'UZAK'
          set -eu
          cd /opt/agency-cortex

          echo "--- zamanlanmis gorevler kuruluyor ---"
          mevcut=$(crontab -l 2>/dev/null | grep -v '# agency-cortex-yedek' || true)
          {
            printf '%s\n' "$mevcut"
            echo "30 3 * * * cd /opt/agency-cortex && /bin/bash ops/yedek_al.sh >> /var/log/agency-cortex-yedek.log 2>&1 # agency-cortex-yedek"
            echo "0 4 * * 0 cd /opt/agency-cortex && /bin/bash ops/yedek_dogrula.sh >> /var/log/agency-cortex-yedek.log 2>&1 # agency-cortex-yedek"
          } | sed '/^$/d' | crontab -
          echo "kurulu gorevler:"
          crontab -l | grep 'agency-cortex-yedek' || true

          echo ""
          echo "--- simdi bir yedek aliniyor ---"
          /bin/bash ops/yedek_al.sh

          echo ""
          echo "--- alinan yedek GERCEKTEN geri yuklenebiliyor mu? ---"
          /bin/bash ops/yedek_dogrula.sh

          # Bu satir, dogrulamanin gercekten calistiginin kanitidir.
          echo "YEDEKLEME_DOGRULAMASI_TAMAMLANDI"
          UZAK

          cikti=$(ssh -i ~/.ssh/id_deploy -o BatchMode=yes "$VPS_USER@$VPS_HOST" \
                    'bash /tmp/yedek_kur.sh; kod=$?; rm -f /tmp/yedek_kur.sh; exit $kod')
          echo "$cikti"

          # Adimlarin sessizce atlanmadigini dogrula.
          for iz in "TAMAM:" "BASARILI: yedek geri yuklenebilir durumda." "YEDEKLEME_DOGRULAMASI_TAMAMLANDI"; do
            if ! printf '%s' "$cikti" | grep -qF "$iz"; then
              echo ""
              echo "HATA: yedekleme adimi eksik calisti. Beklenen iz bulunamadi:"
              echo "  $iz"
              echo "Bu, bir alt adimin sessizce atlandigi anlamina gelir."
              exit 1
            fi
          done
          echo ""
          echo "TAMAM: yedek alindi VE geri yuklenebildigi dogrulandi."

      - name: Ilk yonetici hesabi
        env:
          ILK_EMAIL: ${{ secrets.ILK_YONETICI_EMAIL }}
          ILK_AD: ${{ secrets.ILK_YONETICI_AD }}
          ILK_SIFRE: ${{ secrets.ILK_YONETICI_SIFRE }}
        run: |
          if [ -z "$ILK_EMAIL" ] || [ -z "$ILK_SIFRE" ]; then
            echo "ATLANDI: ILK_YONETICI_EMAIL veya ILK_YONETICI_SIFRE tanimli degil."
            echo "Panele giris yapabilmek icin bu degerleri GitHub deposunda"
            echo "Settings > Secrets and variables > Actions altina ekleyin,"
            echo "sonra bu is akisini tekrar calistirin."
            exit 0
          fi

          # 1) Uzak betik sunucuya yazilir. Icinde hicbir gizli bilgi yoktur.
          #    python -c ile verilen kod da gizli bilgi icermez; gizli
          #    degerler yalnizca stdin'den okunur.
          ssh -i ~/.ssh/id_deploy -o BatchMode=yes "$VPS_USER@$VPS_HOST" \
            "cat > /tmp/ilk_yonetici.sh" <<'UZAK'
          set -eu
          cd /opt/agency-cortex
          docker compose exec -T api python -c '
          import os, sys
          os.environ["ILK_YONETICI_EMAIL"] = sys.stdin.readline().rstrip("\n")
          os.environ["ILK_YONETICI_AD"] = sys.stdin.readline().rstrip("\n")
          os.environ["ILK_YONETICI_SIFRE"] = sys.stdin.readline().rstrip("\n")
          from app.cli.hesap import main
          raise SystemExit(main(["ilk-yonetici"]))
          '
          UZAK

          # 2) Gizli degerler yalnizca stdin uzerinden gonderilir.
          {
            printf '%s\n' "$ILK_EMAIL"
            printf '%s\n' "${ILK_AD:-Ajans Yoneticisi}"
            printf '%s\n' "$ILK_SIFRE"
          } | ssh -i ~/.ssh/id_deploy -o BatchMode=yes "$VPS_USER@$VPS_HOST" \
                'bash /tmp/ilk_yonetici.sh; cikis=$?; rm -f /tmp/ilk_yonetici.sh; exit $cikis'

      # Giris calismiyorsa nedenini bulur. Sifrenin KENDISI hicbir zaman
      # yazilmaz; yalnizca uzunluk, bosluk ve ASCII disi karakter bilgisi ile
      # saklanan ozete uyup uymadigi bildirilir.
      - name: Hesap tanilama
        if: ${{ inputs.tanilama == 'EVET' }}
        env:
          ILK_EMAIL: ${{ secrets.ILK_YONETICI_EMAIL }}
          ILK_SIFRE: ${{ secrets.ILK_YONETICI_SIFRE }}
        run: |
          if [ -z "$ILK_EMAIL" ] || [ -z "$ILK_SIFRE" ]; then
            echo "ATLANDI: gizli degerler tanimli degil."
            exit 0
          fi

          ssh -i ~/.ssh/id_deploy -o BatchMode=yes "$VPS_USER@$VPS_HOST" \
            "cat > /tmp/tanilama.sh" <<'UZAK'
          set -eu
          cd /opt/agency-cortex
          docker compose exec -T api python -c '
          from app.cli.hesap import main
          raise SystemExit(main(["tanilama"]))
          '
          UZAK

          {
            printf '%s\n' "$ILK_EMAIL"
            printf '%s\n' "$ILK_SIFRE"
          } | ssh -i ~/.ssh/id_deploy -o BatchMode=yes "$VPS_USER@$VPS_HOST" \
                'bash /tmp/tanilama.sh; cikis=$?; rm -f /tmp/tanilama.sh; exit $cikis'

      # Panele girilemiyorsa: kullanicinin sifresini KENDI TARAYICISINDA
      # belirleyecegi tek kullanimlik bir bag uretir. Sifre hicbir aktarim
      # yolundan gecmedigi icin bosluk/Unicode/klavye farklari devre disi kalir.
      #
      # Ayrica uretimdeki girisi sunucunun icinden bir kez dener; boylece
      # sorunun uygulamada mi yoksa tarayici tarafinda mi oldugu kesinlesir.
      - name: Sifre belirleme bagi
        if: ${{ inputs.kurtarma == 'EVET' }}
        env:
          ILK_EMAIL: ${{ secrets.ILK_YONETICI_EMAIL }}
          ILK_SIFRE: ${{ secrets.ILK_YONETICI_SIFRE }}
        run: |
          if [ -z "$ILK_EMAIL" ]; then
            echo "ATLANDI: ILK_YONETICI_EMAIL tanimli degil."
            exit 0
          fi

          echo "=== 1) Uretimdeki giris sunucunun icinden deneniyor ==="
          ssh -i ~/.ssh/id_deploy -o BatchMode=yes "$VPS_USER@$VPS_HOST" \
            "cat > /tmp/giris_denemesi.sh" <<'UZAK'
          set -eu
          cd /opt/agency-cortex
          docker compose exec -T api python -c '
          from app.cli.hesap import main
          raise SystemExit(main(["giris-denemesi"]))
          '
          UZAK

          {
            printf '%s\n' "$ILK_EMAIL"
            printf '%s\n' "$ILK_SIFRE"
          } | ssh -i ~/.ssh/id_deploy -o BatchMode=yes "$VPS_USER@$VPS_HOST" \
                'bash /tmp/giris_denemesi.sh; cikis=$?; rm -f /tmp/giris_denemesi.sh; exit $cikis'

          echo ""
          echo "=== 2) Sifre belirleme bagi uretiliyor ==="
          ssh -i ~/.ssh/id_deploy -o BatchMode=yes "$VPS_USER@$VPS_HOST" \
            "HESAP_EMAIL='$ILK_EMAIL' DOMAIN='$PUBLIC_DOMAIN' bash -s" <<'UZAK'
          set -eu
          cd /opt/agency-cortex
          docker compose exec -T \
            -e HESAP_EMAIL="$HESAP_EMAIL" \
            -e PUBLIC_DOMAIN="$DOMAIN" \
            api python -m app.cli.hesap kurtarma-bagi </dev/null
          UZAK

      - name: Disaridan HTTPS kontrolu
        run: |
          echo "HTTPS sertifikasinin olusmasi birkac dakika surebilir."
          saglik="hayir"
          for i in $(seq 1 20); do
            kod=$(curl -sS -o /dev/null -w "%{http_code}" --max-time 15 \
              "https://$PUBLIC_DOMAIN/healthz" 2>/dev/null || echo "000")
            echo "saglik denemesi $i: HTTP $kod"
            if [ "$kod" = "200" ]; then
              saglik="evet"
              break
            fi
            sleep 15
          done

          if [ "$saglik" != "evet" ]; then
            echo "UYARI: HTTPS henuz yanit vermiyor. Sertifika hazirlaniyor olabilir."
            echo "Sistem sunucu icinde saglikli; yalnizca disaridan erisim bekleniyor."
            exit 0
          fi

          echo "BASARILI: https://$PUBLIC_DOMAIN/healthz calisiyor"
          curl -sS "https://$PUBLIC_DOMAIN/version"
          echo

          # Panel gercekten disaridan aciliyor mu? Sadece /healthz kontrolu
          # Asama 7'de panelin erisilemez kaldigini fark etmemizi engellemisti.
          echo "Panel giris sayfasi kontrol ediliyor..."
          govde=""
          for i in $(seq 1 10); do
            govde=$(curl -sS --max-time 15 "https://$PUBLIC_DOMAIN/panel/giris" 2>/dev/null || echo "")
            if printf '%s' "$govde" | grep -q 'action="/panel/giris"'; then
              echo "BASARILI: https://$PUBLIC_DOMAIN/panel/giris giris formunu donduruyor"
              exit 0
            fi
            echo "panel denemesi $i: form bulunamadi, tekrar denenecek"
            sleep 10
          done

          echo "HATA: Panel giris sayfasi disaridan acilmiyor."
          echo "Donen govdenin ilk 400 karakteri:"
          printf '%s' "$govde" | head -c 400
          echo
          echo "Olasi neden: ters vekil (Caddy) /panel yolunu uygulamaya yonlendirmiyor."
          exit 1
