name: Test ve Imaj Derleme

# Bu is akisi GitHub'in sunucularinda calisir.
# Gelistirme ortamindan Docker Hub'a erisilemedigi icin imajin gercekten
# derlenip derlenmedigi burada dogrulanir.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}-api

jobs:
  test:
    name: Testler
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16.10-alpine
        env:
          POSTGRES_DB: agency_cortex_test
          POSTGRES_USER: agency
          POSTGRES_PASSWORD: ci-parola
        options: >-
          --health-cmd "pg_isready -U agency"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

      redis:
        image: redis:7.4-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    env:
      POSTGRES_HOST: localhost
      POSTGRES_PORT: 5432
      POSTGRES_DB: agency_cortex_test
      POSTGRES_USER: agency
      POSTGRES_PASSWORD: ci-parola
      REDIS_HOST: localhost
      SECRET_KEY: ci-test-secret
      ENCRYPTION_KEY: ci-test-encryption
      APP_ENV: development

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Bagimliliklari kur
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install ".[dev]"

      - name: Kod bicimi kontrolu
        working-directory: backend
        run: ruff check app tests

      - name: Testleri calistir
        working-directory: backend
        run: pytest -q

      - name: Migration'lar temiz mi?
        working-directory: backend
        run: |
          alembic upgrade head
          # Modellerde olup migration'a yansimamis degisiklik var mi?
          alembic check

  build:
    name: Docker imajini derle
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Registry'ye giris
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Etiketleri hazirla
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=long

      - name: Derle ve gonder
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          # Pull request'lerde yalnizca derlenir, gonderilmez.
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Imaj gercekten calisiyor mu?
        if: github.event_name != 'pull_request'
        run: |
          # Konteyner acilip saglik ucuna yanit veriyor mu?
          docker run -d --name test-api \
            -e POSTGRES_HOST=yok -e REDIS_HOST=yok \
            -e SECRET_KEY=x -e ENCRYPTION_KEY=y \
            -p 8000:8000 \
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8000/healthz >/dev/null 2>&1; then
              echo "Konteyner ayakta ve /healthz yanit veriyor"
              curl -sS http://localhost:8000/version
              docker rm -f test-api
              exit 0
            fi
            sleep 2
          done
          echo "HATA: Konteyner saglik ucuna yanit vermedi"
          docker logs test-api
          docker rm -f test-api
          exit 1
