name: Test ve Imaj Derleme

# Bu is akisi GitHub'in sunucularinda calisir.
# Gelistirme ortamindan Docker Hub'a erisilemedigi icin imajin gercekten
# derlenip derlenmedigi burada dogrulanir.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}-api

jobs:
  test:
    name: Testler
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16.10-alpine
        env:
          POSTGRES_DB: agency_cortex_test
          POSTGRES_USER: agency
          POSTGRES_PASSWORD: ci-parola
        options: >-
          --health-cmd "pg_isready -U agency"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

      redis:
        image: redis:7.4-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    env:
      POSTGRES_HOST: localhost
      POSTGRES_PORT: 5432
      POSTGRES_DB: agency_cortex_test
      POSTGRES_USER: agency
      POSTGRES_PASSWORD: ci-parola
      REDIS_HOST: localhost
      SECRET_KEY: ci-test-secret
      ENCRYPTION_KEY: ci-test-encryption
      APP_ENV: development

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Bagimliliklari kur
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install ".[dev]"

      - name: Kod bicimi kontrolu
        working-directory: backend
        run: ruff check app tests

      - name: Testleri calistir
        working-directory: backend
        run: pytest -q

      # Testler semayi migration ile kurar; bu adim yalnizca modellerde
      # olup migration'a yansimamis bir degisiklik kalmadigini dogrular.
      - name: Migration'lar modellerle uyumlu mu?
        working-directory: backend
        run: alembic check

      # Caddy (ters vekil) yapilandirmasinda yazim hatasi varsa dagitim
      # sirasinda degil, burada yakalansin.
      - name: Caddy yapilandirmasi gecerli mi?
        run: |
          docker run --rm \
            -v "$PWD/ops/Caddyfile:/etc/caddy/Caddyfile:ro" \
            -e PUBLIC_DOMAIN=ornek.test \
            -e ACME_EMAIL=ci@ornek.test \
            -e N8N_DOMAIN=n8n.ornek.test \
            -e N8N_BASIC_USER=ci \
            -e N8N_BASIC_HASH='$2a$14$Ci0000000000000000000uCiHashYerTutucuDegeri00000000000' \
            caddy:2-alpine caddy validate --adapter caddyfile --config /etc/caddy/Caddyfile

      # Panel yolunun ters vekilde acikta kalmadigini dogrular.
      - name: Caddyfile panel yolunu uygulamaya yonlendiriyor mu?
        run: |
          if grep -q 'Panel henuz kurulmadi' ops/Caddyfile; then
            echo "HATA: Caddyfile hala Asama 1 yer tutucusunu donduruyor."
            exit 1
          fi
          if ! grep -qE '^\s*handle \{' ops/Caddyfile; then
            echo "HATA: Caddyfile'da genel (catch-all) handle blogu yok;"
            echo "panel gibi yeni yollar disaridan erisilemez kalir."
            exit 1
          fi
          echo "TAMAM: genel handle blogu mevcut."

      # n8n alt alan adi acikta kalmasin: onunde bir kilit olmali.
      - name: n8n alt alan adi korumali mi?
        run: |
          if ! grep -q 'N8N_DOMAIN' ops/Caddyfile; then
            echo "HATA: Caddyfile'da n8n alan adi tanimli degil."
            exit 1
          fi
          if ! grep -q 'basic_auth' ops/Caddyfile; then
            echo "HATA: n8n alt alan adinin onunde kilit (basic_auth) yok."
            echo "Kurulumdan sonra ilk acan kisi n8n sahibi olur."
            exit 1
          fi
          echo "TAMAM: n8n korumali."

  build:
    name: Docker imajini derle
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # Docker imaj adlari KUCUK HARF olmak zorundadir.
      # github.repository "BrandCoor/agency-cortex" seklinde buyuk harf
      # icerdigi icin dogrudan kullanilamaz.
      - name: Imaj adini hazirla
        id: img
        run: |
          ad="$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')-api"
          echo "ref=${{ env.REGISTRY }}/${ad}" >> "$GITHUB_OUTPUT"
          echo "Imaj adresi: ${{ env.REGISTRY }}/${ad}"

      - name: Registry'ye giris
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Etiketleri hazirla
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.img.outputs.ref }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=long

      - name: Derle ve gonder
        id: build
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          # Pull request'lerde yalnizca derlenir, gonderilmez.
          push: ${{ github.event_name != 'pull_request' }}
          # Imaj yerel Docker'a da yuklenir ki duman testi onu calistirabilsin.
          load: ${{ github.event_name == 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Imajin gercekten acilip yanit verdigini dogrular.
      # Derlenmis ama acilmayan bir imaj, hic derlenmemis kadar kotudur.
      - name: Imaj gercekten calisiyor mu?
        if: github.event_name != 'pull_request'
        run: |
          set -eu
          IMAJ="${{ steps.img.outputs.ref }}:latest"
          echo "Test edilen imaj: $IMAJ"
          docker pull "$IMAJ"

          # Veritabani ve Redis bilerek erisilemez birakildi:
          # /healthz bagimliliklara BAKMADAN yanit vermelidir.
          docker run -d --name test-api \
            -e POSTGRES_HOST=erisilemez-sunucu \
            -e REDIS_HOST=erisilemez-sunucu \
            -e SECRET_KEY=duman-testi \
            -e ENCRYPTION_KEY=duman-testi \
            -p 8000:8000 "$IMAJ"

          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8000/healthz >/dev/null 2>&1; then
              echo "BASARILI: konteyner ayakta ve /healthz yanit veriyor"
              echo "--- /version ---"
              curl -sS http://localhost:8000/version
              echo
              echo "--- /readyz (bagimliliklar yok, 503 beklenir) ---"
              curl -sS -o /dev/null -w "HTTP %{http_code}\n" http://localhost:8000/readyz || true
              docker rm -f test-api >/dev/null
              exit 0
            fi
            sleep 2
          done

          echo "HATA: konteyner 60 saniyede saglik ucuna yanit vermedi"
          echo "--- konteyner loglari ---"
          docker logs test-api || true
          docker rm -f test-api >/dev/null || true
          exit 1
